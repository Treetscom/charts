# The web application's deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "py-app.fullname" . }}-app
  labels:
    {{- include "py-app.labels" . | nindent 4 }}
spec:
  {{- if and (not .Values.autoscaling.enabled) (not .Values.scaledObject.app.enabled) }}
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 5 }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "py-app.selectorLabels" . | nindent 6 }}
      deployment_type: web
  template:
    metadata:
      {{- $podAnnotations := merge (deepCopy (default dict .Values.podAnnotations)) (default dict .Values.instrumentation.annotations) }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $baseSelectorLabels := (include "py-app.selectorLabels" . | fromYaml) }}
      {{- $_ := set $baseSelectorLabels "deployment_type" "web" }}
      {{- $mergedLabels := merge $baseSelectorLabels (default dict .Values.instrumentation.labels) }}
      labels:
        {{- toYaml $mergedLabels | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{ . | toYaml | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "py-app.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- if .Values.command }}
          command: {{ .Values.command }}
          {{- end}}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.probes.liveness }}
          livenessProbe: {{ . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe: {{ . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.startup }}
          startupProbe: {{ . | toYaml | nindent 12 }}
          {{- end }}
          {{- include "py-app.envs" . | indent 10 -}}
          {{- with .Values.securityContext }}
          securityContext: {{ . | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

