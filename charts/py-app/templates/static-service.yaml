{{- if and .Values.service.enabled .Values.service.staticServiceName -}}
{{- /* Targets the app port even when waf.enabled: in-cluster callers bypass the WAF on purpose (see waf.port in values.yaml). */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.staticServiceName }}
  labels:
    {{- include "py-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | default .Values.service.port }}
      protocol: TCP
      name: static-service
  selector:
    {{- include "py-app.selectorLabels" . | nindent 4 }}
    deployment_type: web
{{- end }}
