{{- if and .Values.waf.enabled .Values.waf.podMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "py-app.fullname" . }}-waf
  labels:
    {{- include "py-app.labels" . | nindent 4 }}
    {{- with .Values.waf.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "py-app.selectorLabels" . | nindent 6 }}
      waf.treets.com/enabled: "true"
  podMetricsEndpoints:
    - port: waf-admin
      path: /metrics
      interval: {{ .Values.waf.podMonitor.interval }}
{{- end }}
